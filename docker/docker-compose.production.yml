# Production overlay: pulls image from GHCR, binds to loopback only. Works against an external DB by default.
# Later docker-compose.self-hosted.yml on top as well if you want the bundled DB.
#
#   docker compose --env-file .env \
#     -f docker/docker-compose.yml \
#     -f docker/docker-compose.production.yml up -d
services:
  app:
    image: ghcr.io/amsterdamtimemachine/data-index/app:production
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    # Required-var guards — fail loud if missing. All other vars in ../.env
    # (PUBLIC_*, BASE_BIN_SIZE, GRID_*, BIN_SIZE_*, CACHE_TTL_MINUTES, etc.)
    # flow through via the base's env_file directive.
    environment:
      DB_HOST: ${DB_HOST:?DB_HOST is required}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
