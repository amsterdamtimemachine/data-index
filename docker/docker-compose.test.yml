# Isolated, ephemeral test DB. Built from Dockerfile.db rather than the stock
# postgis image because the schema declares a roaringbitmap column (cell_features)
# — drizzle can't create the table without the type. `image:` names the build so
# CI can pull the same artifact instead of rebuilding it per job.
services:
  test-db:
    image: ghcr.io/amsterdamtimemachine/data-index/db:16-3.4
    build:
      context: ..
      dockerfile: docker/Dockerfile.db
    container_name: dataindex-test-db
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: dataindex_test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d dataindex_test"]
      interval: 2s
      timeout: 5s
      retries: 15
