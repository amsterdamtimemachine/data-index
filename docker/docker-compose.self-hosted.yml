# Self-hosted overlay: adds a bundled Postgres+PostGIS service and wires the app
# to it. Layer on top of docker-compose.yml for local dev or single-box deploys.
#
#   docker compose --env-file .env \
#     -f docker/docker-compose.yml \
#     -f docker/docker-compose.self-hosted.yml up
services:
  dataindex-db:
    # Postgres + PostGIS + pg_roaringbitmap. Not the stock postgis image: the schema
    # declares a roaringbitmap column (cell_features), so db:push-schema cannot create
    # the table without the type. An external DB needs the extension installed too.
    #
    # Pulled from GHCR — built + published by .github/workflows/db-image.yml, so a
    # self-hosting deploy pulls it instead of compiling roaringbitmap locally. To build
    # it by hand: docker build -f docker/Dockerfile.db -t ghcr.io/amsterdamtimemachine/data-index/db:16 .
    image: ghcr.io/amsterdamtimemachine/data-index/db:16
    # Survive host reboots (e.g. unattended-upgrade kernel reboots) so the DB comes
    # back with the app, which already sets this in docker-compose.yml.
    restart: unless-stopped
    # No container_name — a fixed name overrides compose's <project>-<service>-<n>
    # scheme, so two stacks built on this overlay would collide on it regardless of
    # --project-name. The app still reaches the DB at `dataindex-db`: that's the
    # service name, resolved on the compose network, not the container name.
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required — copy .env.example to .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required — copy .env.example to .env}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required — copy .env.example to .env}
    # Loopback only — the DB port is published for the host-side CLI (db:push-schema,
    # db:ingest), never for anything off-box. Bare "${DB_PORT}:5432" would put
    # Postgres on the public interface of a deployed server.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    shm_size: 256m
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - atm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    # Override .env's DB_HOST (which workstation CLI uses, e.g. localhost) so the
    # app container reaches the bundled DB via the compose network name.
    environment:
      DB_HOST: dataindex-db
      DB_PORT: 5432
    depends_on:
      dataindex-db:
        condition: service_healthy

volumes:
  pgdata:
