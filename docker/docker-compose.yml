# Base compose: application only. Assumes an external Postgres+PostGIS reachable

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - ../.env
    networks:
      - atm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/metadata"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  atm-network:
    driver: bridge
